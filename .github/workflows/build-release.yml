name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build (basic, filter, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - basic
          - filter
          - both

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools (Ninja & ccache)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          link-to-sdk: true

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x app/src/main/cpp/build.sh

      - name: Build Native C++ Libraries
        run: |
          cd app/src/main/cpp
          bash build.sh
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Set QNN_SDK_ROOT if Qualcomm QAIRT (QNN) SDK 2.39.0 is installed/downloaded in CI
          # QNN_SDK_ROOT: ${{ github.workspace }}/qairt/2.39.0.250926

      - name: Build Release APK
        run: |
          if [ "${{ inputs.flavor }}" = "basic" ]; then
            ./gradlew assembleBasicRelease --stacktrace
          elif [ "${{ inputs.flavor }}" = "filter" ]; then
            ./gradlew assembleFilterRelease --stacktrace
          else
            ./gradlew assembleBasicRelease assembleFilterRelease --stacktrace
          fi
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: LocalDream-Release-APKs
          path: app/build/outputs/apk/*/release/*.apk
