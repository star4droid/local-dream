name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build (basic, filter, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - basic
          - filter
          - both

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          link-to-sdk: true

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x app/src/main/cpp/build.sh

      - name: Build Native C++ Libraries
        run: |
          cd app/src/main/cpp
          bash build.sh

      - name: Build Release APK
        run: |
          if [ "${{ inputs.flavor }}" = "basic" ]; then
            ./gradlew assembleBasicRelease --stacktrace
          elif [ "${{ inputs.flavor }}" = "filter" ]; then
            ./gradlew assembleFilterRelease --stacktrace
          else
            ./gradlew assembleBasicRelease assembleFilterRelease --stacktrace
          fi

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: LocalDream-Release-APKs
          path: app/build/outputs/apk/*/release/*.apk
